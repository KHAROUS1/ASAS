<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <title>لفائف عزل حراري ومائي</title>
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#e5d8c2"/>
    </linearGradient>
    <linearGradient id="rollA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7a88f"/>
      <stop offset="0.28" stop-color="#e6dccb"/>
      <stop offset="0.6" stop-color="#d5c9b4"/>
      <stop offset="1" stop-color="#ac9c82"/>
    </linearGradient>
    <linearGradient id="rollB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5b69d"/>
      <stop offset="0.3" stop-color="#f1e9db"/>
      <stop offset="0.65" stop-color="#ddd2be"/>
      <stop offset="1" stop-color="#b4a58b"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#4a4e56"/>
      <stop offset="0.6" stop-color="#303339"/>
      <stop offset="1" stop-color="#181a1e"/>
    </radialGradient>
    <linearGradient id="goldg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9864c"/>
      <stop offset="0.5" stop-color="#e0c48f"/>
      <stop offset="1" stop-color="#a9864c"/>
    </linearGradient>
    <pattern id="dots5" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#15161a" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#ibg)"/>
  <circle cx="640" cy="142" r="190" fill="#ede2cf"/>
  <path d="M0 468 Q210 432 420 466 T800 454 V600 H0 Z" fill="#e1d4be"/>
  <rect width="800" height="600" fill="url(#dots5)"/>

  <ellipse cx="404" cy="500" rx="280" ry="34" fill="#15161a" opacity="0.1"/>

  <!-- back roll -->
  <g transform="translate(262 206)">
    <path d="M0 62 Q0 36 74 36 Q148 36 148 62 V252 Q148 278 74 278 Q0 278 0 252 Z" fill="url(#rollA)"/>
    <ellipse cx="74" cy="62" rx="74" ry="38" fill="#efe6d6"/>
    <g transform="translate(74 62) scale(1 0.52)">
      <circle r="68" fill="#d9cdb8"/>
      <circle r="54" fill="none" stroke="#a2947c" stroke-width="4"/>
      <circle r="40" fill="none" stroke="#a2947c" stroke-width="4"/>
      <circle r="26" fill="none" stroke="#a2947c" stroke-width="4"/>
      <circle r="13" fill="url(#core)"/>
      <circle r="5" fill="#0d0e10"/>
    </g>
    <path d="M20 252 Q74 268 128 252" fill="none" stroke="#8f8068" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M0 164 h148" stroke="#8f8068" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="0" y="196" width="148" height="30" fill="url(#goldg2)" opacity="0.9"/>
    <rect x="20" y="205" width="58" height="7" rx="3.5" fill="#fffaf0" opacity="0.8"/>
    <path d="M18 62 Q18 80 74 80 Q130 80 130 62" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <!-- front roll leaning -->
  <g transform="translate(384 240) rotate(6 138 150)">
    <path d="M0 66 Q0 38 76 38 Q152 38 152 66 V244 Q152 272 76 272 Q0 272 0 244 Z" fill="url(#rollB)"/>
    <ellipse cx="76" cy="66" rx="76" ry="40" fill="#f7f1e6"/>
    <g transform="translate(76 66) scale(1 0.53)">
      <circle r="70" fill="#e4dac7"/>
      <circle r="70" fill="none" stroke="#b0a188" stroke-width="2"/>
      <circle r="56" fill="none" stroke="#a99a81" stroke-width="4"/>
      <circle r="42" fill="none" stroke="#a99a81" stroke-width="4"/>
      <circle r="28" fill="none" stroke="#a99a81" stroke-width="4"/>
      <circle r="13" fill="url(#core)"/>
      <circle r="5" fill="#0d0e10"/>
    </g>
    <path d="M16 244 Q76 262 136 244" fill="none" stroke="#8f8068" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M0 160 h152" stroke="#8f8068" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="0" y="188" width="152" height="30" fill="url(#goldg2)" opacity="0.92"/>
    <rect x="22" y="197" width="62" height="7" rx="3.5" fill="#fffaf0" opacity="0.8"/>
    <rect x="22" y="208" width="36" height="5" rx="2.5" fill="#15161a" opacity="0.22"/>
    <path d="M18 66 Q18 86 76 86 Q134 86 134 66" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
  </g>

  <!-- small loose piece -->
  <g transform="translate(146 402) rotate(-8 60 34)">
    <rect width="150" height="68" rx="8" fill="#d7cbb6"/>
    <path d="M12 16 q64 16 126 0" fill="none" stroke="#a2947c" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M12 34 q64 16 126 0" fill="none" stroke="#a2947c" stroke-opacity="0.3" stroke-width="3"/>
    <rect y="50" width="150" height="10" fill="url(#goldg2)" opacity="0.85"/>
    <ellipse cx="0" cy="34" rx="12" ry="34" fill="#efe6d6"/>
  </g>

  <g fill="#b08c4f" opacity="0.55">
    <circle cx="660" cy="330" r="3"/>
    <circle cx="696" cy="366" r="2"/>
    <circle cx="126" cy="270" r="2.5"/>
  </g>
</svg>
