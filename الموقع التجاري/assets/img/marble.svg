<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <title>ألواح رخام وجرانيت</title>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#e5d8c3"/>
    </linearGradient>
    <linearGradient id="slab1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="0.55" stop-color="#eee8dc"/>
      <stop offset="1" stop-color="#ddd4c5"/>
    </linearGradient>
    <linearGradient id="slab2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e3d6"/>
      <stop offset="1" stop-color="#cdc4b4"/>
    </linearGradient>
    <linearGradient id="slab3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d2c6"/>
      <stop offset="1" stop-color="#b9b0a1"/>
    </linearGradient>
    <pattern id="dots4" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#15161a" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#mbg)"/>
  <circle cx="150" cy="140" r="170" fill="#ece0cd"/>
  <path d="M0 472 Q220 438 430 470 T800 456 V600 H0 Z" fill="#e2d5bf"/>
  <rect width="800" height="600" fill="url(#dots4)"/>

  <ellipse cx="402" cy="516" rx="300" ry="30" fill="#15161a" opacity="0.09"/>

  <!-- back slab -->
  <g transform="translate(452 150) rotate(7 130 180)">
    <rect x="0" y="0" width="250" height="350" rx="6" fill="url(#slab3)"/>
    <path d="M18 40 q46 38 30 88 q-18 58 34 96 q40 30 34 80" fill="none" stroke="#8f8778" stroke-opacity="0.4" stroke-width="3"/>
    <path d="M186 30 q-22 60 12 100 q30 36 6 86 q-18 38 10 70" fill="none" stroke="#8f8778" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M52 250 q40 -20 76 6 q30 22 62 8" fill="none" stroke="#c9a468" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- middle slab -->
  <g transform="translate(286 128) rotate(-3 140 190)">
    <rect x="0" y="0" width="270" height="374" rx="6" fill="url(#slab2)"/>
    <path d="M22 46 q54 34 36 86 q-20 54 30 92 q46 34 42 92" fill="none" stroke="#8b8273" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M200 28 q-30 58 6 102 q34 42 4 96 q-20 36 12 78" fill="none" stroke="#8b8273" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M60 268 q46 -26 84 4 q32 26 68 6" fill="none" stroke="#c9a468" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M30 120 q50 16 76 -10" fill="none" stroke="#c9a468" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- front slab -->
  <g transform="translate(118 168) rotate(-9 150 190)">
    <rect x="0" y="0" width="280" height="356" rx="6" fill="url(#slab1)"/>
    <path d="M24 44 q62 40 40 96 q-22 56 32 98 q48 38 44 88" fill="none" stroke="#a09584" stroke-opacity="0.42" stroke-width="3.5"/>
    <path d="M210 24 q-36 64 2 110 q36 44 2 100 q-22 34 10 76" fill="none" stroke="#a09584" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M26 170 q60 -30 104 2 q38 28 78 4" fill="none" stroke="#c9a468" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M74 300 q52 -22 92 4" fill="none" stroke="#a09584" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="356" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- small tile leaning -->
  <g transform="translate(578 342) rotate(4 60 80)">
    <rect width="126" height="164" rx="4" fill="#efe8db"/>
    <path d="M14 26 q28 22 18 50 q-10 30 20 48 q22 16 18 34" fill="none" stroke="#9b9181" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M88 18 q-18 32 0 56 q18 24 0 54" fill="none" stroke="#c9a468" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <g fill="#b08c4f" opacity="0.55">
    <circle cx="664" cy="180" r="3"/>
    <circle cx="700" cy="214" r="2"/>
    <circle cx="106" cy="420" r="2.5"/>
  </g>
</svg>
