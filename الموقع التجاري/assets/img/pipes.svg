<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img">
  <title>مواسير ووصلات PVC</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#e6d9c4"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf6"/>
      <stop offset="0.42" stop-color="#e7e0d3"/>
      <stop offset="1" stop-color="#c3b7a2"/>
    </linearGradient>
    <linearGradient id="pipe2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ece1"/>
      <stop offset="0.5" stop-color="#d9cfbe"/>
      <stop offset="1" stop-color="#b6a88f"/>
    </linearGradient>
    <linearGradient id="goldg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9864c"/>
      <stop offset="0.5" stop-color="#dcc08a"/>
      <stop offset="1" stop-color="#a9864c"/>
    </linearGradient>
    <pattern id="dots6" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#15161a" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#pbg)"/>
  <circle cx="628" cy="152" r="188" fill="#ede2cf"/>
  <path d="M0 470 Q210 434 420 468 T800 456 V600 H0 Z" fill="#e1d4be"/>
  <rect width="800" height="600" fill="url(#dots6)"/>

  <ellipse cx="400" cy="512" rx="292" ry="30" fill="#15161a" opacity="0.09"/>

  <!-- pipe 1 back -->
  <g transform="translate(122 330)">
    <rect x="0" y="0" width="520" height="54" rx="27" fill="url(#pipe2)"/>
    <ellipse cx="520" cy="27" rx="17" ry="27" fill="#b6a88f"/>
    <ellipse cx="520" cy="27" rx="10" ry="20" fill="#8e816b"/>
    <ellipse cx="0" cy="27" rx="17" ry="27" fill="#f7f2e8"/>
    <rect x="74" y="0" width="14" height="54" fill="url(#goldg3)" opacity="0.65"/>
    <rect x="430" y="0" width="14" height="54" fill="url(#goldg3)" opacity="0.65"/>
  </g>

  <!-- pipe 2 -->
  <g transform="translate(174 394)">
    <rect x="0" y="0" width="490" height="58" rx="29" fill="url(#pipe)"/>
    <ellipse cx="490" cy="29" rx="18" ry="29" fill="#c2b5a0"/>
    <ellipse cx="490" cy="29" rx="11" ry="21" fill="#948773"/>
    <ellipse cx="0" cy="29" rx="18" ry="29" fill="#fdfaf4"/>
    <ellipse cx="0" cy="29" rx="11" ry="21" fill="#e5dccd"/>
    <rect x="80" y="0" width="12" height="58" fill="url(#goldg3)" opacity="0.7"/>
    <rect x="398" y="0" width="12" height="58" fill="url(#goldg3)" opacity="0.7"/>
    <path d="M24 12 H466" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- elbow fitting -->
  <g transform="translate(520 168)">
    <path d="M0 34 h54 a34 34 0 0 1 34 34 v86 h-46 v-74 a10 10 0 0 0 -10 -10 H0 Z" fill="url(#pipe)" stroke="#b3a58d" stroke-width="2"/>
    <rect x="0" y="34" width="22" height="36" rx="4" fill="url(#goldg3)"/>
    <rect x="42" y="128" width="46" height="26" rx="4" fill="url(#goldg3)"/>
    <path d="M8 48 h34" stroke="#ffffff4d" stroke-width="3"/>
  </g>

  <!-- small pipe standing -->
  <g transform="translate(652 254)">
    <rect x="0" y="0" width="64" height="214" rx="12" fill="url(#pipe)"/>
    <ellipse cx="32" cy="4" rx="32" ry="12" fill="#f7f2e8"/>
    <ellipse cx="32" cy="210" rx="32" ry="12" fill="#b6a88f"/>
    <rect x="0" y="62" width="64" height="24" fill="url(#goldg3)" opacity="0.75"/>
  </g>

  <g fill="#b08c4f" opacity="0.55">
    <circle cx="102" cy="450" r="2.5"/>
    <circle cx="700" cy="478" r="3"/>
    <circle cx="734" cy="440" r="2"/>
  </g>
</svg>
